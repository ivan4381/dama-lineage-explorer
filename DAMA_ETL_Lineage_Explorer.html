<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>DAMA ETL Lineage Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- SheetJS: only used to read .xlsx / .xls uploads. CSV is parsed by the page itself. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky glass header, stat strip, then a 3-pane workspace
   (Explore | Lineage canvas / Rows | Details) floating over a soft aurora backdrop. */
:root {
  --bg: #e6edef;
  --bg-solid: #f3f7f8;
  --fg: #0f2229;
  --muted: #4c626a;
  --faint: #718790;
  --glass: rgba(255, 255, 255, .50);
  --glass-hi: rgba(255, 255, 255, .78);
  --glass-lo: rgba(255, 255, 255, .30);
  --stroke: rgba(255, 255, 255, .80);
  --line: rgba(15, 40, 48, .11);
  --line-strong: rgba(15, 40, 48, .22);
  --shadow: 0 12px 32px -14px rgba(16, 42, 52, .28);
  --shadow-sm: 0 4px 14px -6px rgba(16, 42, 52, .22);
  --accent: #0b8278;
  --accent-ink: #ffffff;
  --accent-soft: rgba(11, 130, 120, .13);
  --orb-1: rgba(38, 178, 164, .50);
  --orb-2: rgba(245, 166, 60, .40);
  --orb-3: rgba(232, 98, 78, .26);
  --orb-4: rgba(74, 144, 217, .36);
  --k-dag: #b86e05;
  --k-task: #6f55cf;
  --k-runner: #56666e;
  --k-script: #0b8278;
  --k-table: #2466b8;
  --warn: #a64c06;
  --warn-soft: rgba(214, 120, 20, .14);
  --edge: rgba(15, 40, 48, .26);
  --font-display: "Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071115; --bg-solid: #0d1b20; --fg: #e2edef; --muted: #9ab0b6; --faint: #6f858b;
    --glass: rgba(20, 36, 42, .52); --glass-hi: rgba(30, 50, 58, .78); --glass-lo: rgba(20, 36, 42, .30);
    --stroke: rgba(255, 255, 255, .09); --line: rgba(220, 240, 245, .09); --line-strong: rgba(220, 240, 245, .20);
    --shadow: 0 16px 38px -16px rgba(0, 0, 0, .65); --shadow-sm: 0 4px 16px -6px rgba(0, 0, 0, .55);
    --accent: #3ccfc0; --accent-ink: #032520; --accent-soft: rgba(60, 207, 192, .15);
    --orb-1: rgba(22, 150, 138, .36); --orb-2: rgba(200, 120, 30, .22); --orb-3: rgba(190, 70, 60, .18); --orb-4: rgba(50, 100, 190, .28);
    --k-dag: #f0a83a; --k-task: #a58ff6; --k-runner: #97a8af; --k-script: #3ccfc0; --k-table: #6daaf2;
    --warn: #f2a45a; --warn-soft: rgba(240, 160, 80, .14); --edge: rgba(220, 240, 245, .24);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071115; --bg-solid: #0d1b20; --fg: #e2edef; --muted: #9ab0b6; --faint: #6f858b;
  --glass: rgba(20, 36, 42, .52); --glass-hi: rgba(30, 50, 58, .78); --glass-lo: rgba(20, 36, 42, .30);
  --stroke: rgba(255, 255, 255, .09); --line: rgba(220, 240, 245, .09); --line-strong: rgba(220, 240, 245, .20);
  --shadow: 0 16px 38px -16px rgba(0, 0, 0, .65); --shadow-sm: 0 4px 16px -6px rgba(0, 0, 0, .55);
  --accent: #3ccfc0; --accent-ink: #032520; --accent-soft: rgba(60, 207, 192, .15);
  --orb-1: rgba(22, 150, 138, .36); --orb-2: rgba(200, 120, 30, .22); --orb-3: rgba(190, 70, 60, .18); --orb-4: rgba(50, 100, 190, .28);
  --k-dag: #f0a83a; --k-task: #a58ff6; --k-runner: #97a8af; --k-script: #3ccfc0; --k-table: #6daaf2;
  --warn: #f2a45a; --warn-soft: rgba(240, 160, 80, .14); --edge: rgba(220, 240, 245, .24);
  color-scheme: dark;
}

/* ---------- Base ---------- */
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--font-mono); font-size: .92em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Aurora backdrop: soft radial colour fields the glass panels blur */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.aurora i { position: absolute; border-radius: 50%; display: block; }
.aurora i:nth-child(1) { width: 60vmax; height: 60vmax; left: -18vmax; top: -22vmax; background: radial-gradient(circle, var(--orb-1), transparent 65%); }
.aurora i:nth-child(2) { width: 48vmax; height: 48vmax; right: -14vmax; top: -10vmax; background: radial-gradient(circle, var(--orb-2), transparent 65%); }
.aurora i:nth-child(3) { width: 50vmax; height: 50vmax; right: 8vmax; bottom: -26vmax; background: radial-gradient(circle, var(--orb-3), transparent 65%); }
.aurora i:nth-child(4) { width: 44vmax; height: 44vmax; left: 10vmax; bottom: -20vmax; background: radial-gradient(circle, var(--orb-4), transparent 65%); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid var(--stroke);
  box-shadow: var(--shadow);
  border-radius: var(--r-lg);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-hi); }
}
@media (prefers-reduced-transparency: reduce) {
  .glass { background: var(--bg-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
}

.app {
  position: relative;
  z-index: 1;
  padding-inline: clamp(16px, 2.2vw, 28px);
  padding-block: 14px 28px;
  display: grid;
  gap: 14px;
  max-width: 1800px;
  margin: 0 auto;
}

/* ---------- Header ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 10px 14px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-right: auto; }
.brand-mark {
  width: 40px; height: 40px; flex: none; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--accent-soft); border: 1px solid var(--stroke); color: var(--accent);
}
.brand h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(17px, 1.5vw, 21px);
  letter-spacing: -.01em;
  line-height: 1.15;
  margin: 0;
}
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.dataset {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  padding: 6px 8px 6px 12px; border-radius: 999px;
  background: var(--glass-lo); border: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted);
}
.dataset strong { color: var(--fg); font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dataset .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line-strong);
  background: var(--glass-hi);
  border-radius: 12px;
  padding: 8px 14px;
  font-weight: 600; font-size: 13px;
  transition: background .15s, border-color .15s, transform .15s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 10px; }
.btn.ghost:hover { color: var(--fg); background: var(--glass-lo); }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border-radius: 11px; border: 1px solid var(--line-strong); background: var(--glass-hi);
}
.icon-btn:hover { border-color: var(--accent); }
.icon-btn:disabled { opacity: .4; cursor: default; border-color: var(--line); }

/* ---------- Stat strip ---------- */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 12px 16px; display: grid; gap: 2px; border-radius: var(--r-md); }
.stat .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .value { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 12px; color: var(--faint); }
.stat.warn .value { color: var(--warn); }
.kdot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: none; }

/* ---------- Workspace ---------- */
.workspace {
  display: grid;
  grid-template-columns: 330px minmax(0, 1fr) 330px;
  gap: 14px;
  align-items: start;
}
.pane { min-width: 0; display: flex; flex-direction: column; height: clamp(560px, calc(100vh - 190px), 1040px); overflow: hidden; }
.pane-head { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.pane-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* Explore pane */
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search input {
  width: 100%; padding: 10px 40px 10px 38px;
  border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--glass-hi); outline: none;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 11px; color: var(--faint);
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px;
}
.filter-group { display: grid; gap: 7px; }
.filter-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; font-weight: 600; }
.linkish:hover { text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong);
  background: var(--glass-lo);
  border-radius: 999px;
  padding: 4px 10px 4px 8px;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  transition: background .15s, border-color .15s, color .15s;
}
.chip .n { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--faint); font-size: 11.5px; }
.chip[aria-pressed="true"] { background: var(--glass-hi); color: var(--fg); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-soft); }
.chip[aria-pressed="true"] .n { color: var(--muted); }
.chip:hover { color: var(--fg); }
.chip .kdot { width: 9px; height: 9px; }
.select {
  width: 100%; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--glass-hi);
}
.results-meta { padding: 8px 16px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.results { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; flex: 1; min-height: 0; }
.result {
  width: 100%; display: flex; gap: 10px; align-items: center; text-align: left;
  border: 1px solid transparent; background: transparent;
  border-radius: 12px; padding: 7px 8px;
}
.result:hover { background: var(--glass-lo); border-color: var(--line); }
.result[aria-current="true"] { background: var(--glass-hi); border-color: var(--accent); }
.result .txt { min-width: 0; display: grid; }
.result .name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result .meta { font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.glyph {
  width: 28px; height: 28px; flex: none; border-radius: 9px;
  display: grid; place-items: center;
  color: var(--kc); background: color-mix(in srgb, var(--kc) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--kc) 30%, transparent);
}
.k-dag { --kc: var(--k-dag); }
.k-task { --kc: var(--k-task); }
.k-runner { --kc: var(--k-runner); }
.k-script { --kc: var(--k-script); }
.k-table { --kc: var(--k-table); }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty h3 { margin: 0; font-family: var(--font-display); color: var(--fg); font-size: 16px; }
.empty p { margin: 0; max-width: 34ch; }

/* Center pane */
.center-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tabs { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--glass-lo); border: 1px solid var(--line); }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--glass-hi); color: var(--fg); box-shadow: var(--shadow-sm); }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; font-size: 13px; color: var(--muted); }
.crumb strong { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--glass-lo); }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toolbar .icon-btn { width: 32px; height: 32px; border-radius: 9px; }

.canvas {
  position: relative; flex: 1; min-height: 0; overflow: auto;
  cursor: grab; touch-action: pan-x pan-y;
  background-image: radial-gradient(var(--line-strong) 1px, transparent 1px);
  background-size: 22px 22px;
}
.canvas.dragging { cursor: grabbing; user-select: none; }
.sizer { position: relative; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; transition: stroke .15s, opacity .15s; }
.edge.on { stroke: var(--accent); stroke-width: 2.2; }
.stage.hl .edge:not(.on) { opacity: .18; }
.stage.hl .node:not(.on) { opacity: .38; }
.arrow-fill { fill: var(--edge); }
.arrow-fill-on { fill: var(--accent); }
.col-label {
  position: absolute; top: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; text-align: center;
}
.col-label span { background: var(--glass-hi); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
.node {
  position: absolute; display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 8px 10px; border-radius: 14px;
  background: var(--glass-hi);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-sm);
  transition: opacity .15s, border-color .15s, transform .15s;
}
.node:hover { border-color: var(--kc); transform: translateY(-1px); }
.node.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-sm); }
.node .txt { min-width: 0; display: grid; }
.node .nn { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .nm { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.more { justify-content: center; color: var(--muted); font-size: 12px; border-style: dashed; cursor: default; }
.canvas-foot {
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.canvas-foot .note { margin-left: auto; color: var(--warn); }

/* Rows table */
.rows-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.rows-tools .search { flex: 1; min-width: 200px; }
.rows-tools .search input { padding-block: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  padding: 4px 6px 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line);
}
.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
.pill button { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.pill button:hover { background: var(--glass-hi); color: var(--fg); }
.table-wrap { flex: 1; min-height: 0; overflow: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1100px; font-size: 12.5px; }
thead th {
  position: sticky; top: 0; z-index: 1; text-align: left;
  background: var(--glass-hi); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700;
  padding: 9px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap;
}
tbody td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 320px; overflow-wrap: anywhere; }
tbody tr:hover td { background: var(--glass-lo); }
td .cell-link { border: 0; background: none; padding: 0; text-align: left; color: inherit; font: inherit; overflow-wrap: anywhere; }
td .cell-link:hover { color: var(--accent); text-decoration: underline; }
td .blank { color: var(--warn); font-style: italic; font-size: 11.5px; }
.tech { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tech i { width: 7px; height: 7px; border-radius: 50%; background: var(--tc, var(--faint)); display: inline-block; }
.pager { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.pager .btns { display: flex; gap: 6px; }

/* Detail pane */
.detail { overflow-y: auto; flex: 1; min-height: 0; padding: 16px; display: grid; gap: 16px; align-content: start; }
.d-kind { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--kc); letter-spacing: .04em; text-transform: uppercase; }
.d-kind .glyph { width: 24px; height: 24px; border-radius: 7px; }
.d-name {
  margin: 6px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.25;
  overflow-wrap: anywhere; text-wrap: balance;
}
.d-name.mono { font-family: var(--font-mono); font-size: 14.5px; font-weight: 500; }
.d-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.fact { background: var(--glass-lo); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.fact dt { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.fact dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fact.wide { grid-column: 1 / -1; }
.dlist h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.dlist h4 span { font-variant-numeric: tabular-nums; color: var(--faint); }
.dlist ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ref {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
  border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 5px 6px;
  font-size: 12.5px; min-width: 0;
}
.ref:hover { background: var(--glass-lo); border-color: var(--line); }
.ref .kdot { background: var(--kc); }
.ref .t { min-width: 0; overflow-wrap: anywhere; }
.ref .s { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap; padding-left: 6px; }
.callout { border-radius: 12px; padding: 10px 12px; font-size: 12.5px; background: var(--warn-soft); color: var(--fg); border: 1px solid var(--line); }
.callout strong { color: var(--warn); }

/* Drop overlay + toast */
.drop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 60%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.drop .box { padding: 40px 48px; text-align: center; border: 2px dashed var(--accent); display: grid; gap: 8px; justify-items: center; }
.drop h2 { margin: 0; font-family: var(--font-display); }
.drop p { margin: 0; color: var(--muted); }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 60; padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: 13px; max-width: min(92vw, 560px);
}
.toast.err { border-color: var(--warn); color: var(--warn); }

/* ---------- Responsive ---------- */
@media (max-width: 1280px) {
  .workspace { grid-template-columns: 310px minmax(0, 1fr); }
  .pane.details { grid-column: 1 / -1; height: auto; max-height: none; }
  .pane.details .detail { overflow: visible; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .pane { height: auto; }
  .pane.explore .results { max-height: 340px; }
  .pane.center { height: 78vh; min-height: 480px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dataset strong { max-width: 150px; }
  .brand p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>

<script>
(() => {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const TECH_COLORS = {

    'excel': '#1f8a4f', 'csv': '#7d8f3a', 'sap bw': '#3b6fc0', 'website': '#9657b8', 'gcs': '#e07a2e', 'postgresql': '#336791', 'oracle': '#c74634',
  };

  const techBadge = (t) => t ? `<span class="tech" style="--tc:${techColor(t)}"><i></i>${esc(t)}</span>` : '';

  /* ================= Parsing ================= */
  // Header aliases, compared after lower-casing and stripping non-alphanumerics.
  const FIELDS = [
    ['dag', ['dagname', 'dag', 'dagid', 'namadag']],
    ['task', ['dagtaskid', 'taskid', 'task', 'dagtask']],
    ['bash', ['bashfilename', 'bashfile', 'bash', 'runner', 'shellscript']],
    ['script', ['pythonscriptfilename', 'pythonscript', 'scriptfilename', 'script', 'python']],
    ['target', ['targettablepath', 'targettable', 'target', 'targetpath']],

    ['source', ['source', 'sourcetable', 'sourcepath', 'sourcetablepath']],
    ['sType', ['sourcetype', 'sourcetabletype']],
  ];
  const normH = (h) => String(h ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');

  function mapHeader(row) {
    const names = row.map(normH);
    const idx = {};
    for (const [key, aliases] of FIELDS) {
      for (const a of aliases) {
        const i = names.indexOf(a);
        if (i >= 0 && !Object.values(idx).includes(i)) { idx[key] = i; break; }
      }
    }
    return idx;
  }
  // Header row may sit below a title block (as in Master Data DAG.xlsx), so scan the first rows.
  function findHeader(aoa) {
    for (let i = 0; i < Math.min(aoa.length, 40); i++) {
      const idx = mapHeader(aoa[i] || []);
      if (idx.dag !== undefined && (idx.target !== undefined || idx.source !== undefined)) return { at: i, idx };

    return null;

  function rowsFromAoa(aoa) {

    if (!h) throw new Error("Couldn't find the column headers. The file needs a 'DAG Name' column plus 'Source' or 'Target Table Path'.");
    const rows = [];
    for (let i = h.at + 1; i < aoa.length; i++) {
      const src = aoa[i] || [];
      const r = {};
      for (const [key] of FIELDS) r[key] = h.idx[key] === undefined ? '' : String(src[h.idx[key]] ?? '').trim();
      if (FIELDS.every(([k]) => !r[k])) continue; // skip fully blank lines

  // RFC-4180 style CSV parser with delimiter sniffing (comma, semicolon, tab, pipe).
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const firstLine = text.split(/\r?\n/, 1)[0] || '';
    let delim = ',', best = 0;
    for (const d of [',', ';', '\t', '|']) {
      const n = firstLine.split(d).length;
      if (n > best) { best = n; delim = d; }
    }
    const out = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
        } else field += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === delim) { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); out.push(row); row = []; field = ''; }
      else if (ch !== '\r') field += ch;
    }
    if (field !== '' || row.length) { row.push(field); out.push(row); }
    return out;
  }

  function parseWorkbook(buffer) {
    if (!window.XLSX) throw new Error('The Excel reader could not load (it needs internet access). Save the sheet as CSV and load that instead.');
    const wb = window.XLSX.read(buffer, { type: 'array' });
    for (const name of wb.SheetNames) {
      const aoa = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false, blankrows: false });
      if (findHeader(aoa)) return { aoa, sheet: name };
    }
    throw new Error("No sheet has a 'DAG Name' column together with 'Source' or 'Target Table Path'.");
  }

  /* ================= Model ================= */
  // Flow graph: source table → processing step (script, or task when no script) → target table.
  function buildModel(rows) {
    const nodes = new Map();
    const out = new Map(), inn = new Map(); // id -> Map(otherId -> Set(rowIndex))
    const mk = (id, kind, name) => {
      let n = nodes.get(id);
      if (!n) {
        n = { id, kind, name, lname: name.toLowerCase(), rows: new Set(), dags: new Set(), techs: new Map(),
          isSource: false, isTarget: false, tasks: new Set(), runners: new Set(), scripts: new Set(),
          srcTables: new Set(), tgtTables: new Set() };
        nodes.set(id, n);
      }
      return n;
    };
    const addEdge = (map, a, b, i) => {
      let m = map.get(a); if (!m) map.set(a, (m = new Map()));
      let s = m.get(b); if (!s) m.set(b, (s = new Set()));
      s.add(i);
    };
    const link = (a, b, i) => { addEdge(out, a, b, i); addEdge(inn, b, a, i); };
    const bump = (n, t) => { if (t) n.techs.set(t, (n.techs.get(t) || 0) + 1); };
    const tkey = (s) => s.trim().toLowerCase();

    rows.forEach((r, i) => {
      const touch = (n) => { n.rows.add(i); if (r.dag) n.dags.add(r.dag); return n; };
      const dagN = r.dag ? touch(mk('D|' + r.dag, 'dag', r.dag)) : null;
      const taskN = r.task ? touch(mk('T|' + r.dag + '|' + r.task, 'task', r.task)) : null;
      if (taskN) taskN.dag = r.dag;
      const runN = r.bash ? touch(mk('R|' + tkey(r.bash), 'runner', r.bash)) : null;
      const scrN = r.script ? touch(mk('S|' + tkey(r.script), 'script', r.script)) : null;
      const src = r.source ? touch(mk('B|' + tkey(r.source), 'table', r.source)) : null;
      const tgt = r.target ? touch(mk('B|' + tkey(r.target), 'table', r.target)) : null;
      if (src) { src.isSource = true; bump(src, r.sType); }
      if (tgt) { tgt.isTarget = true; bump(tgt, r.tType); }

      // Structural relations (for the details panel)
      for (const n of [dagN, taskN, runN, scrN]) {
        if (!n) continue;
        if (taskN && n !== taskN) n.tasks.add(taskN.id);
        if (runN && n !== runN) n.runners.add(runN.id);
        if (scrN && n !== scrN) n.scripts.add(scrN.id);
        if (src) n.srcTables.add(src.id);
        if (tgt) n.tgtTables.add(tgt.id);
        bump(n, r.sType); bump(n, r.tType);
      }

      // Flow edges
      const proc = scrN || taskN;
      r.procId = proc ? proc.id : null;
      r.srcId = src ? src.id : null;
      r.tgtId = tgt ? tgt.id : null;

      if (proc) {
        if (src) link(src.id, proc.id, i);
        if (tgt) link(proc.id, tgt.id, i);
      } else if (src && tgt) link(src.id, tgt.id, i);
    });

    for (const n of nodes.values()) {
      n.tech = [...n.techs.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || '';

    rows.forEach((r) => { for (const t of new Set([r.sType, r.tType])) if (t) techRows.set(t, (techRows.get(t) || 0) + 1); });

    focus: null, history: [], depth: 1, tab: 'graph',
    rowsFocus: null, rowsQuery: '', onlyBlank: false, page: 0,
    zoom: 1, activeResult: -1, resultIds: [],
  };

  /* ================= Loading ================= */
  function setDataset(rows, name, origin) {
    state.model = buildModel(rows);
    state.name = name;
    state.origin = origin;
    state.focus = null; state.history = []; state.rowsFocus = null; state.page = 0;
    state.techs.clear(); state.dagScope = '';
    $('#datasetName').textContent = name;
    $('#datasetRows').textContent = '· ' + plural(rows.length, 'row', 'rows');
    $('#resetData').hidden = origin === 'built-in' || !EMBEDDED;
    renderStats(); renderTechChips(); renderDagScope();
    focus(pickDefaultFocus(), false);
    renderResults();
  }

  // Start on the busiest table so the first view already shows real lineage.
  function pickDefaultFocus() {
    let best = null, bestScore = -1;
    for (const n of state.model.nodes.values()) {
      if (n.kind !== 'table') continue;
      const s = (state.model.out.get(n.id)?.size || 0) + (state.model.inn.get(n.id)?.size || 0);
      if (s > bestScore && (state.model.out.get(n.id)?.size || 0) > 0 && (state.model.inn.get(n.id)?.size || 0) > 0) { best = n; bestScore = s; }
    }
    if (!best) best = [...state.model.nodes.values()].find((n) => n.kind === 'dag') || null;
    return best ? best.id : null;
  }

  function rowsFromEmbedded() {
    const [header, ...data] = EMBEDDED;
    return rowsFromAoa([header, ...data]);
  }

  async function loadFile(file) {
    try {
      const lower = file.name.toLowerCase();
      let rows, note = '';
      if (lower.endsWith('.xlsx') || lower.endsWith('.xls')) {
        const { aoa, sheet } = parseWorkbook(new Uint8Array(await file.arrayBuffer()));
        rows = rowsFromAoa(aoa); note = ` (sheet “${sheet}”)`;
      } else {
        rows = rowsFromAoa(parseCSV(await file.text()));
      }
      setDataset(rows, file.name, 'upload');
      const plain = rows.map(({ dag, task, bash, script, target, tType, source, sType }) => [dag, task, bash, script, target, tType, source, sType]);
      store.set(STORE_KEY, { name: file.name, rows: plain });
      toast(`Loaded ${file.name}${note} · ${plural(rows.length, 'row', 'rows')}`);
    } catch (e) {
      toast(e.message || 'That file could not be read.', true);
    }
  }

  /* ================= Stats ================= */
  function renderStats() {
    const m = state.model;
    const c = { dag: 0, task: 0, script: 0, runner: 0, table: 0, src: 0, tgt: 0 };
    for (const n of m.nodes.values()) {
      c[n.kind]++;
      if (n.kind === 'table') { if (n.isSource) c.src++; if (n.isTarget) c.tgt++; }
    }
    const blanks = m.rows.filter((r) => r.blank).length;
    const tile = (label, value, sub, cls = '', dot = '') =>
      `<div class="stat glass ${cls}"><span class="label">${dot}${label}</span><span class="value">${value}</span><span class="sub">${sub}</span></div>`;
    const kd = (k) => `<span class="kdot" style="background:var(--k-${k})"></span>`;
    $('#stats').innerHTML =
      tile('DAGs', fmt(c.dag), plural(c.task, 'task', 'tasks'), '', kd('dag')) +
      tile('Scripts', fmt(c.script), plural(c.runner, 'bash runner', 'bash runners'), '', kd('script')) +
      tile('Tables', fmt(c.table), `${fmt(c.src)} read · ${fmt(c.tgt)} written`, '', kd('table')) +
      tile('Technologies', fmt(m.techRows.size), [...m.techRows.keys()].slice(0, 3).join(', ') + (m.techRows.size > 3 ? '…' : '')) +
      tile('Lineage rows', fmt(m.rows.length), 'one source → one target each') +
      tile('Incomplete rows', fmt(blanks), 'blank source or target', blanks ? 'warn' : '');
  }

  /* ================= Filters ================= */
  function renderKindChips(counts) {
    $('#kindChips').innerHTML = FILTER_KINDS.map(([k, label, cls]) =>
      `<button class="chip ${cls}" data-kind="${k}" aria-pressed="${state.kinds.has(k)}"><span class="kdot" style="background:var(--kc)"></span>${label}<span class="n">${fmt(counts[k] || 0)}</span></button>`
    ).join('');
  }
  function renderTechChips() {
    const entries = [...state.model.techRows.entries()].sort((a, b) => b[1] - a[1]);
    $('#techChips').innerHTML = entries.map(([t, n]) =>
      `<button class="chip" data-tech="${esc(t)}" aria-pressed="${state.techs.has(t)}"><span class="kdot" style="background:${techColor(t)};border-radius:50%"></span>${esc(t)}<span class="n">${fmt(n)}</span></button>`
    ).join('');
    $('#techAll').textContent = state.techs.size ? 'Clear' : 'Any';
  }
  function renderDagScope() {
    const dags = [...state.model.nodes.values()].filter((n) => n.kind === 'dag').map((n) => n.name).sort();
    $('#dagScope').innerHTML = `<option value="">All DAGs (${fmt(dags.length)})</option>` +
      dags.map((d) => `<option value="${esc(d)}"${d === state.dagScope ? ' selected' : ''}>${esc(d)}</option>`).join('');
  }

  const kindKeyMatch = (n, key) => key === 'source' ? (n.kind === 'table' && n.isSource)
    : key === 'target' ? (n.kind === 'table' && n.isTarget) : n.kind === key;

  function passesContext(n, toks) {
    if (state.dagScope && !n.dags.has(state.dagScope)) return false;
    if (state.techs.size && ![...n.techs.keys()].some((t) => state.techs.has(t))) return false;
    if (toks.length && !toks.every((t) => n.lname.includes(t))) return false;
    return true;
  }

  function renderResults() {
    const q = state.query.trim().toLowerCase();
    const toks = q.split(/\s+/).filter(Boolean);
    const counts = {};
    const hits = [];
    for (const n of state.model.nodes.values()) {
      if (!passesContext(n, toks)) continue;
      let shown = false;
      for (const [k] of FILTER_KINDS) {
        if (kindKeyMatch(n, k)) { counts[k] = (counts[k] || 0) + 1; if (state.kinds.has(k)) shown = true; }
      }
      if (!shown) continue;
      const nm = n.name.toLowerCase();
      const score = !toks.length ? 0 : nm === q ? 0 : nm.startsWith(toks[0]) ? 1 : nm.includes(q) ? 2 : 3;
      hits.push({ n, score });
    }
    hits.sort((a, b) => a.score - b.score || KIND_ORDER[a.n.kind] - KIND_ORDER[b.n.kind] || a.n.name.localeCompare(b.n.name));
    renderKindChips(counts);

    const LIMIT = 300;
    const list = hits.slice(0, LIMIT).map((h) => h.n);
    state.resultIds = list.map((n) => n.id);
    state.activeResult = -1;
    $('#resultCount').textContent = hits.length > LIMIT
      ? `Showing ${fmt(LIMIT)} of ${fmt(hits.length)} — refine the search`
      : plural(hits.length, 'match', 'matches');

    const el = $('#results');
    if (!state.kinds.size) {
      el.innerHTML = `<li class="empty"><h3>No entity type selected</h3><p>Turn on at least one entity type above.</p></li>`;
      return;
    }
    if (!list.length) {
      el.innerHTML = `<li class="empty"><h3>Nothing matches</h3><p>Try a shorter search, or clear the technology and DAG filters.</p></li>`;
      return;
    }
    el.innerHTML = list.map((n, i) =>
      `<li><button class="result" data-id="${esc(n.id)}" data-i="${i}" aria-current="${n.id === state.focus}">${glyph(n.kind)}<span class="txt"><span class="name${n.kind === 'dag' || n.kind === 'task' ? '' : ' mono'}" title="${esc(n.name)}">${highlight(n.name, toks)}</span><span class="meta">${esc(metaLine(n))}</span></span></button></li>`
    ).join('');
  }

  function highlight(name, toks) {
    let html = esc(name);
    if (!toks.length) return html;
    const lower = name.toLowerCase();
    const t = toks[0];
    const i = lower.indexOf(t);
    if (i < 0) return html;
    return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + t.length)) + '</mark>' + esc(name.slice(i + t.length));
  }

  function roleOf(n) {
    return n.isSource && n.isTarget ? 'Source & target' : n.isTarget ? 'Target' : 'Source';
  }
  function metaLine(n) {
    const dagsTxt = n.dags.size === 1 ? [...n.dags][0] : plural(n.dags.size, 'DAG', 'DAGs');
    switch (n.kind) {
      case 'dag': return `${plural(n.tasks.size, 'task', 'tasks')} · ${plural(n.tgtTables.size, 'target', 'targets')}`;
      case 'task': return `in ${n.dag}`;
      case 'runner': return `${plural(n.scripts.size, 'script', 'scripts')} · ${dagsTxt}`;
      case 'script': return `${dagsTxt} · ${plural(n.tgtTables.size, 'target', 'targets')}`;
      case 'table': return [n.tech, roleOf(n), dagsTxt].filter(Boolean).join(' · ');
    }
    return '';
  }

  /* ================= Focus & history ================= */
  function focus(id, pushHistory = true) {
    if (!id || !state.model.nodes.has(id)) { state.focus = null; renderAll(); return; }
    if (pushHistory && state.focus && state.focus !== id) state.history.push(state.focus);
    state.focus = id;
    $('#backBtn').disabled = !state.history.length;
    renderAll(true);
  }
  function renderAll(scrollToFocus) {
    renderCrumb();
    renderGraph(scrollToFocus);
    renderDetail();
    if (state.tab === 'rows') renderRows();
    document.querySelectorAll('#results .result').forEach((b) => b.setAttribute('aria-current', String(b.dataset.id === state.focus)));
  }
  function renderCrumb() {
    const n = state.model.nodes.get(state.focus);
    $('#crumb').innerHTML = n
      ? `<span class="eyebrow">Focus</span>${glyph(n.kind)}<strong class="${n.kind === 'table' || n.kind === 'script' ? 'mono' : ''}" title="${esc(n.name)}">${esc(n.name)}</strong>`
      : '<span>Pick an entity from the list to see its lineage.</span>';
  }

  /* ================= Lineage graph ================= */
  const NODE_W = 240, NODE_H = 54, COL_GAP = 92, ROW_GAP = 12, PAD_X = 28, PAD_TOP = 52, PAD_BOTTOM = 28;
  const MAX_NODES = 700, MAX_PER_COL = 150;

  function procIdsOf(n, pred) {
    const ids = new Set();
    for (const i of n.rows) {
      const r = state.model.rows[i];
      if (pred && !pred(i)) continue;
      if (r.procId) ids.add(r.procId);
      else { if (r.srcId) ids.add(r.srcId); if (r.tgtId) ids.add(r.tgtId); }
    }
    return [...ids];
  }

  function computeLineage() {
    const m = state.model;
    const f = m.nodes.get(state.focus);
    const rows = m.rows;
    const scopePred = state.dagScope ? (i) => rows[i].dag === state.dagScope : null;
    let seedPred = null, seeds;
    if (f.kind === 'dag') seedPred = (i) => rows[i].dag === f.name;
    else if (f.kind === 'task') seedPred = (i) => rows[i].dag === f.dag && rows[i].task === f.name;
    else if (f.kind === 'runner') seedPred = (i) => rows[i].bash.toLowerCase() === f.name.toLowerCase();
    const both = (a, b) => (a && b ? (i) => a(i) && b(i) : a || b);
    const firstPred = both(seedPred, scopePred);
    seeds = (f.kind === 'table' || f.kind === 'script' || (f.kind === 'task' && !f.scripts.size))
      ? [f.id] : procIdsOf(f, firstPred);

    // steps along table→step→table edges; tables need 2 steps per "hop"
    const hops = state.depth;
    const seedIsTable = f.kind === 'table';
    const maxSteps = hops >= 99 ? Infinity : seedIsTable ? hops * 2 : hops * 2 - 1;

    const layer = new Map(seeds.map((s) => [s, 0]));
    const seedSet = new Set(seeds);
    let trimmed = false;
    const neighbors = (id, dir, pred) => {
      const map = (dir === 'out' ? m.out : m.inn).get(id);
      if (!map) return [];
      const res = [];
      for (const [o, rs] of map) {
        if (!pred) { res.push(o); continue; }
        for (const i of rs) if (pred(i)) { res.push(o); break; }
      }
      return res;
    };
    for (const dir of ['in', 'out']) {
      let frontier = [...seeds], d = 0;
      while (frontier.length && d < maxSteps) {
        d++;
        const next = [];
        for (const id of frontier) {
          const pred = seedSet.has(id) ? firstPred : scopePred;
          for (const o of neighbors(id, dir, pred)) {
            if (layer.has(o)) continue;
            if (layer.size >= MAX_NODES) { trimmed = true; break; }
            layer.set(o, dir === 'in' ? -d : d);
            next.push(o);
          }
        }
        frontier = next;
      }
    }

    // Visible edges between placed nodes
    const edges = [];
    for (const a of layer.keys()) {
      const map = m.out.get(a);
      if (!map) continue;
      for (const [b, rs] of map) {
        if (!layer.has(b)) continue;
        const pred = seedSet.has(a) || seedSet.has(b) ? firstPred : scopePred;
        if (pred && ![...rs].some(pred)) continue;
        edges.push([a, b]);
      }
    }
    return { layer, edges, seedSet, trimmed };
  }

  function layout({ layer, edges }) {
    const cols = new Map();
    for (const [id, l] of layer) { if (!cols.has(l)) cols.set(l, []); cols.get(l).push(id); }
    const keys = [...cols.keys()].sort((a, b) => a - b);
    const nbr = new Map();
    const addN = (a, b) => { if (!nbr.has(a)) nbr.set(a, []); nbr.get(a).push(b); };
    for (const [a, b] of edges) { addN(a, b); addN(b, a); }
    const name = (id) => state.model.nodes.get(id).name;

    const order = new Map();
    const seedCol = cols.get(0) || [];
    seedCol.sort((a, b) => name(a).localeCompare(name(b)));
    seedCol.forEach((id, i) => order.set(id, i));
    // Order columns outward from the focus using barycentres of the inner neighbour column
    const outward = keys.filter((k) => k !== 0).sort((a, b) => Math.abs(a) - Math.abs(b) || a - b);
    for (const k of outward) {
      const inner = k > 0 ? k - 1 : k + 1;
      const innerSet = new Set(cols.get(inner) || []);
      const bary = (id) => {
        const ns = (nbr.get(id) || []).filter((x) => innerSet.has(x));
        return ns.length ? ns.reduce((s, x) => s + (order.get(x) ?? 0), 0) / ns.length : Infinity;
      };
      const col = cols.get(k);
      const bc = new Map(col.map((id) => [id, bary(id)]));
      col.sort((a, b) => bc.get(a) - bc.get(b) || name(a).localeCompare(name(b)));
      col.forEach((id, i) => order.set(id, i));
    }
    // One refinement pass on the focus column using both sides
    if (seedCol.length > 1) {
      const bc = new Map(seedCol.map((id) => {
        const ns = (nbr.get(id) || []).filter((x) => layer.get(x) !== 0);
        return [id, ns.length ? ns.reduce((s, x) => s + order.get(x), 0) / ns.length : Infinity];
      }));
      seedCol.sort((a, b) => bc.get(a) - bc.get(b) || name(a).localeCompare(name(b)));
    }

    const pos = new Map();
    const hidden = new Map();
    const colHeights = keys.map((k) => Math.min(cols.get(k).length, MAX_PER_COL + 1) * (NODE_H + ROW_GAP) - ROW_GAP);
    const maxH = Math.max(...colHeights, NODE_H);
    keys.forEach((k, ci) => {
      const x = PAD_X + ci * (NODE_W + COL_GAP);
      const y0 = PAD_TOP + (maxH - colHeights[ci]) / 2;
      const col = cols.get(k);
      col.slice(0, MAX_PER_COL).forEach((id, ri) => pos.set(id, { x, y: y0 + ri * (NODE_H + ROW_GAP) }));
      if (col.length > MAX_PER_COL) hidden.set(k, { count: col.length - MAX_PER_COL, x, y: y0 + MAX_PER_COL * (NODE_H + ROW_GAP) });
    });
    const width = PAD_X * 2 + keys.length * NODE_W + (keys.length - 1) * COL_GAP;
    const height = PAD_TOP + maxH + PAD_BOTTOM;
    return { keys, pos, hidden, width, height };
  }

  function nodeMeta(n) {
    if (n.kind === 'table') return [n.tech, roleOf(n)].filter(Boolean).join(' · ');
    if (n.kind === 'task') return `Task · ${n.dag}`;
    if (n.kind === 'script') return `Script · ${n.dags.size === 1 ? [...n.dags][0] : plural(n.dags.size, 'DAG', 'DAGs')}`;
    return KIND_META[n.kind].label;
  }

  function colLabel(k, keys) {
    if (k === 0) return 'Focus';
    const dir = k < 0 ? 'Upstream' : 'Downstream';
    return `${dir} ${Math.abs(k)}`;
  }

  let lastLayout = null;
  function renderGraph(scrollToFocus) {
    const stage = $('#stage');
    const canvas = $('#canvas');
    if (!state.focus) {
      stage.innerHTML = '';
      $('#sizer').style.width = '100%'; $('#sizer').style.height = '100%';
      stage.innerHTML = `<div class="empty" style="position:relative;width:min(420px,80vw);margin:60px auto"><h3>No entity selected</h3><p>Search or pick a DAG, script or table from the list to draw its lineage.</p></div>`;
      $('#legend').innerHTML = legendHtml('');
      return;
    }
    const lin = computeLineage();
    const L = layout(lin);
    lastLayout = L;
    const m = state.model;
    const fid = state.focus;

    const edgePath = (a, b) => {
      const pa = L.pos.get(a), pb = L.pos.get(b);
      if (!pa || !pb) return '';
      if (a === b) {
        const x = pa.x + NODE_W, y = pa.y;
        return `M${x} ${y + 16} C${x + 46} ${y - 18}, ${x + 46} ${y + NODE_H + 18}, ${x} ${y + NODE_H - 16}`;
      }
      const sx = pa.x + NODE_W, sy = pa.y + NODE_H / 2, tx = pb.x, ty = pb.y + NODE_H / 2;
      const c = Math.max(40, (tx - sx) / 2);
      if (tx > sx) return `M${sx} ${sy} C${sx + c} ${sy}, ${tx - c} ${ty}, ${tx - 2} ${ty}`;
      return `M${sx} ${sy} C${sx + 90} ${sy}, ${tx - 90} ${ty}, ${tx - 2} ${ty}`;
    };

    let svg = `<svg width="${L.width}" height="${L.height}" aria-hidden="true"><defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="arrow-fill"/></marker>
      <marker id="arrOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="arrow-fill-on"/></marker></defs>`;
    for (const [a, b] of lin.edges) {
      const d = edgePath(a, b);
      if (d) svg += `<path class="edge" d="${d}" data-a="${esc(a)}" data-b="${esc(b)}" marker-end="url(#arr)"/>`;
    }
    svg += '</svg>';

    let html = svg;
    L.keys.forEach((k, ci) => {
      const x = PAD_X + ci * (NODE_W + COL_GAP);
      html += `<div class="col-label" style="left:${x}px;width:${NODE_W}px"><span>${colLabel(k, L.keys)}</span></div>`;
    });
    for (const [id, p] of L.pos) {
      const n = m.nodes.get(id);
      const cls = `node ${KIND_META[n.kind].cls}${id === fid ? ' focus' : ''}`;
      html += `<button class="${cls}" style="left:${p.x}px;top:${p.y}px;width:${NODE_W}px;height:${NODE_H}px" data-id="${esc(id)}" title="${esc(n.name)}">${glyph(n.kind)}<span class="txt"><span class="nn${n.kind === 'table' || n.kind === 'script' ? ' mono' : ''}">${esc(n.name)}</span><span class="nm">${esc(nodeMeta(n))}</span></span></button>`;
    }
    for (const [, h] of L.hidden) {
      html += `<div class="node more" style="left:${h.x}px;top:${h.y}px;width:${NODE_W}px;height:${NODE_H}px">+${fmt(h.count)} more — narrow with DAG scope</div>`;
    }
    stage.innerHTML = html;
    stage.style.width = L.width + 'px';
    stage.style.height = L.height + 'px';

    const note = lin.trimmed ? 'Graph trimmed at ' + fmt(MAX_NODES) + ' nodes — lower the depth or set a DAG scope' : '';
    $('#legend').innerHTML = legendHtml(note, lin);

    if (scrollToFocus) {
      // auto-fit when the graph is larger than the view, otherwise 100%
      const fitZ = fitZoom();
      state.zoom = Math.min(1, Math.max(0.8, fitZ)); // keep labels readable; scroll/drag for the rest
      applyZoom();
      const p = L.pos.get(fid) || [...L.pos.values()][0];
      if (p) {
        canvas.scrollLeft = Math.max(0, (p.x + NODE_W / 2) * state.zoom - canvas.clientWidth / 2);
        canvas.scrollTop = Math.max(0, (p.y + NODE_H / 2) * state.zoom - canvas.clientHeight / 2);
      }
    } else applyZoom();
  }

  function legendHtml(note, lin) {
    const items = ['dag', 'task', 'runner', 'script', 'table']
      .map((k) => `<span class="legend-item"><span class="kdot" style="background:var(--k-${k})"></span>${KIND_META[k].label}</span>`).join('');
    const size = lin ? `<span>${plural(lin.layer.size, 'node', 'nodes')} · ${plural(lin.edges.length, 'edge', 'edges')}</span>` : '';
    return `${items}<span aria-hidden="true">·</span>${size}${note ? `<span class="note">${esc(note)}</span>` : ''}`;
  }

  function fitZoom() {
    if (!lastLayout) return 1;
    const c = $('#canvas');
    return Math.min(c.clientWidth / lastLayout.width, c.clientHeight / lastLayout.height);
  }
  function applyZoom() {
    if (!lastLayout) return;
    const z = state.zoom;
    $('#stage').style.transform = `scale(${z})`;
    $('#sizer').style.width = lastLayout.width * z + 'px';
    $('#sizer').style.height = lastLayout.height * z + 'px';
  }
  function zoomBy(f) {
    const c = $('#canvas');
    const cx = (c.scrollLeft + c.clientWidth / 2) / state.zoom, cy = (c.scrollTop + c.clientHeight / 2) / state.zoom;
    state.zoom = Math.min(2, Math.max(0.2, state.zoom * f));
    applyZoom();
    c.scrollLeft = cx * state.zoom - c.clientWidth / 2;
    c.scrollTop = cy * state.zoom - c.clientHeight / 2;
  }

  // Hover: light up a node's direct edges and neighbours
  function setHover(id) {
    const stage = $('#stage');
    stage.querySelectorAll('.on').forEach((e) => e.classList.remove('on'));
    stage.querySelectorAll('.edge').forEach((e) => e.setAttribute('marker-end', 'url(#arr)'));
    if (!id) { stage.classList.remove('hl'); return; }
    stage.classList.add('hl');
    const on = new Set([id]);
    stage.querySelectorAll('.edge').forEach((e) => {
      if (e.dataset.a === id || e.dataset.b === id) {
        e.classList.add('on'); e.setAttribute('marker-end', 'url(#arrOn)');
        on.add(e.dataset.a); on.add(e.dataset.b);
      }
    });
    stage.querySelectorAll('.node[data-id]').forEach((n) => { if (on.has(n.dataset.id)) n.classList.add('on'); });
  }

  /* ================= Details ================= */
  function refList(title, ids, sub) {
    const m = state.model;
    const arr = [...ids].map((id) => m.nodes.get(id)).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
    if (!arr.length) return '';
    const LIMIT = 12;
    const li = (n, i) => `<li${i >= LIMIT ? ' hidden data-more' : ''}><button class="ref ${KIND_META[n.kind].cls}" data-id="${esc(n.id)}"><span class="kdot"></span><span class="t${n.kind === 'table' || n.kind === 'script' ? ' mono' : ''}">${esc(n.name)}</span><span class="s">${esc(sub ? sub(n) : '')}</span></button></li>`;
    const more = arr.length > LIMIT ? `<li><button class="linkish" data-showmore>Show all ${fmt(arr.length)}</button></li>` : '';
    return `<section class="dlist"><h4>${esc(title)} <span>${fmt(arr.length)}</span></h4><ul>${arr.map(li).join('')}${more}</ul></section>`;
  }

  function renderDetail() {
    const el = $('#detail');
    const m = state.model;
    const n = m.nodes.get(state.focus);
    if (!n) {
      el.innerHTML = `<div class="empty"><h3>Nothing selected</h3><p>Details for the focused DAG, task, script or table appear here.</p></div>`;
      return;
    }
    const inIds = new Set(m.inn.get(n.id)?.keys() || []);
    const outIds = new Set(m.out.get(n.id)?.keys() || []);
    const dagIds = new Set([...n.dags].map((d) => 'D|' + d));
    const blanks = [...n.rows].filter((i) => m.rows[i].blank).length;
    const fact = (k, v, wide) => `<div class="fact${wide ? ' wide' : ''}"><dt>${k}</dt><dd>${v}</dd></div>`;
    const techs = [...n.techs.keys()];
    const tsub = (x) => x.tech;
    let facts = '', lists = '';

    switch (n.kind) {
      case 'table':
        facts = fact('Technology', techs.map(techBadge).join(' ') || '—') + fact('Role', roleOf(n)) +
          fact('Written by', plural(inIds.size, 'step', 'steps')) + fact('Read by', plural(outIds.size, 'step', 'steps'));
        lists = refList('Written by', inIds, (x) => x.kind === 'task' ? 'task' : '') + refList('Read by', outIds) + refList('Used in DAGs', dagIds);
        break;
      case 'script':
        facts = fact('DAGs', fmt(n.dags.size)) + fact('Tasks', fmt(n.tasks.size)) +
          fact('Reads', plural(n.srcTables.size, 'table', 'tables')) + fact('Writes', plural(n.tgtTables.size, 'table', 'tables')) +
          fact('Bash runner', [...n.runners].map((id) => esc(m.nodes.get(id).name)).join(', ') || '—', true);
        lists = refList('Reads from', n.srcTables, tsub) + refList('Writes to', n.tgtTables, tsub) + refList('DAGs', dagIds) + refList('Tasks', n.tasks, (x) => x.dag);
        break;
      case 'dag':
        facts = fact('Tasks', fmt(n.tasks.size)) + fact('Scripts', fmt(n.scripts.size)) +
          fact('Source tables', fmt(n.srcTables.size)) + fact('Target tables', fmt(n.tgtTables.size));
        lists = refList('Tasks', n.tasks) + refList('Scripts', n.scripts) + refList('Target tables', n.tgtTables, tsub) + refList('Source tables', n.srcTables, tsub) + refList('Bash runners', n.runners);
        break;
      case 'task':
        facts = fact('DAG', `<button class="linkish" data-id="${esc('D|' + n.dag)}">${esc(n.dag)}</button>`, true) +
          fact('Bash runner', [...n.runners].map((id) => esc(m.nodes.get(id).name)).join(', ') || '—', true) +
          fact('Reads', plural(n.srcTables.size, 'table', 'tables')) + fact('Writes', plural(n.tgtTables.size, 'table', 'tables'));
        lists = refList('Scripts', n.scripts) + refList('Writes to', n.tgtTables, tsub) + refList('Reads from', n.srcTables, tsub);
        break;
      case 'runner':
        facts = fact('DAGs', fmt(n.dags.size)) + fact('Tasks', fmt(n.tasks.size)) + fact('Scripts', fmt(n.scripts.size)) + fact('Rows', fmt(n.rows.size));
        lists = refList('Scripts', n.scripts) + refList('DAGs', dagIds) + refList('Tasks', n.tasks, (x) => x.dag);
        break;
    }

    const warn = blanks
      ? `<div class="callout"><strong>${plural(blanks, 'row has', 'rows have')} a blank source or target.</strong> The file or table was not found during tracing, so the lineage here may be incomplete.</div>`
      : '';

    el.innerHTML = `
      <div>
        <span class="d-kind ${KIND_META[n.kind].cls}">${glyph(n.kind)}${KIND_META[n.kind].label}</span>
        <h3 class="d-name${n.kind === 'table' || n.kind === 'script' || n.kind === 'runner' ? ' mono' : ''}">${esc(n.name)}</h3>
        <div class="d-actions">
          <button class="btn" id="copyName"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy name</button>
          <button class="btn" id="viewRowsBtn">View ${plural(n.rows.size, 'row', 'rows')}</button>
        </div>
      </div>
      <dl class="facts">${facts}</dl>
      ${warn}
      ${lists}`;
  }

  /* ================= Rows view ================= */
  const COLS = [
    ['dag', 'DAG Name', 'D|'], ['task', 'DAG Task Id', null], ['bash', 'Bash File Name', 'R|'], ['script', 'Python Script File Name', 'S|'],
    ['target', 'Target Table Path', 'B|'], ['tType', 'Target Table Type', null], ['source', 'Source', 'B|'], ['sType', 'Source Type', null],
  ];
  const PAGE = 50;

  function filteredRows() {
    const m = state.model;
    const toks = state.rowsQuery.toLowerCase().split(/\s+/).filter(Boolean);
    const scope = state.rowsFocus ? m.nodes.get(state.rowsFocus)?.rows : null;
    const out = [];
    m.rows.forEach((r, i) => {
      if (scope && !scope.has(i)) return;
      if (state.dagScope && r.dag !== state.dagScope) return;
      if (state.techs.size && !state.techs.has(r.sType) && !state.techs.has(r.tType)) return;
      if (state.onlyBlank && !r.blank) return;
      if (toks.length) {
        const hay = (r.dag + ' ' + r.task + ' ' + r.bash + ' ' + r.script + ' ' + r.target + ' ' + r.tType + ' ' + r.source + ' ' + r.sType).toLowerCase();
        if (!toks.every((t) => hay.includes(t))) return;
      }
      out.push(r);
    });
    return out;
  }

  function renderRows() {
    const m = state.model;
    const list = filteredRows();
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    state.page = Math.min(state.page, pages - 1);
    const slice = list.slice(state.page * PAGE, state.page * PAGE + PAGE);
    const fnode = state.rowsFocus ? m.nodes.get(state.rowsFocus) : null;
    $('#rowsPill').innerHTML = fnode
      ? `<span class="pill" title="${esc(fnode.name)}">${KIND_META[fnode.kind].label}: <span>${esc(fnode.name)}</span><button id="clearRowsFocus" aria-label="Show all rows">✕</button></span>`
      : '';

    const cell = (r, [key, , prefix]) => {
      const v = r[key];
      if (!v) return (key === 'target' || key === 'source') ? '<span class="blank">not found</span>' : '<span style="color:var(--faint)">—</span>';
      if (key === 'tType' || key === 'sType') return techBadge(v);
      if (!prefix && key !== 'task') return esc(v);
      let id;
      if (key === 'task') id = 'T|' + r.dag + '|' + v;
      else if (prefix === 'B|' || prefix === 'R|' || prefix === 'S|') id = prefix + v.trim().toLowerCase();
      else id = prefix + v;
      const mono = key !== 'dag' && key !== 'task' ? ' mono' : '';
      return `<button class="cell-link${mono}" data-id="${esc(id)}">${esc(v)}</button>`;
    };

    $('#tableWrap').innerHTML = list.length
      ? `<table><thead><tr>${COLS.map((c) => `<th scope="col">${c[1]}</th>`).join('')}</tr></thead><tbody>${slice.map((r) => `<tr>${COLS.map((c) => `<td>${cell(r, c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`
      : `<div class="empty"><h3>No rows match</h3><p>Clear the row filter, the DAG scope or the technology filter.</p></div>`;

    const from = list.length ? state.page * PAGE + 1 : 0;
    const to = Math.min(list.length, (state.page + 1) * PAGE);
    $('#pager').innerHTML = `<span>${fmt(from)}–${fmt(to)} of ${plural(list.length, 'row', 'rows')}</span>
      <span class="btns"><button class="btn" id="prevPage" ${state.page === 0 ? 'disabled' : ''}>Previous</button><button class="btn" id="nextPage" ${state.page >= pages - 1 ? 'disabled' : ''}>Next</button></span>`;
  }

  function setTab(tab) {
    state.tab = tab;
    $('#tabGraph').setAttribute('aria-selected', String(tab === 'graph'));
    $('#tabRows').setAttribute('aria-selected', String(tab === 'rows'));
    $('#viewGraph').hidden = tab !== 'graph';
    $('#viewRows').hidden = tab !== 'rows';
    $('#viewGraph').style.display = tab === 'graph' ? 'flex' : 'none';
    $('#viewRows').style.display = tab === 'rows' ? 'flex' : 'none';
    if (tab === 'rows') renderRows(); else renderGraph(true);
  }

  /* ================= Toast ================= */
  let toastTimer;
  function toast(msg, isErr) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, isErr ? 6000 : 3200);
  }

  /* ================= Events ================= */
  // Search (debounced)
  let qTimer;
  $('#q').addEventListener('input', (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.query = e.target.value; renderResults(); }, 90); });
  $('#q').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveResult(0); }
    if (e.key === 'Enter' && state.resultIds.length) { e.preventDefault(); focus(state.resultIds[0]); }
    if (e.key === 'Escape') { e.target.value = ''; state.query = ''; renderResults(); }
  });
  function moveResult(i) {
    const btns = [...document.querySelectorAll('#results .result')];
    if (!btns.length) return;
    const j = Math.max(0, Math.min(btns.length - 1, i));
    state.activeResult = j;
    btns[j].focus();
  }
  $('#results').addEventListener('keydown', (e) => {
    const i = Number(e.target.dataset?.i);
    if (Number.isNaN(i)) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); moveResult(i + 1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (i === 0) $('#q').focus(); else moveResult(i - 1); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  });

  // Generic "open entity" clicks (results, nodes, detail refs, table cells)
  document.addEventListener('click', (e) => {
    const more = e.target.closest('[data-showmore]');
    if (more) { more.closest('ul').querySelectorAll('[data-more]').forEach((li) => { li.hidden = false; }); more.parentElement.remove(); return; }
    const t = e.target.closest('[data-id]');
    if (!t || t.classList.contains('edge')) return;
    const id = t.dataset.id;
    if (!state.model.nodes.has(id)) { toast('That entity is not in the lineage graph.', true); return; }
    if (t.classList.contains('cell-link')) { focus(id); setTab('graph'); return; }
    focus(id);
  });

  $('#kindChips').addEventListener('click', (e) => {
    const c = e.target.closest('[data-kind]'); if (!c) return;
    const k = c.dataset.kind;
    state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k);
    renderResults();
  });
  $('#kindsAll').addEventListener('click', () => { FILTER_KINDS.forEach(([k]) => state.kinds.add(k)); renderResults(); });
  $('#techChips').addEventListener('click', (e) => {
    const c = e.target.closest('[data-tech]'); if (!c) return;
    const t = c.dataset.tech;
    state.techs.has(t) ? state.techs.delete(t) : state.techs.add(t);
    renderTechChips(); renderResults(); if (state.tab === 'rows') { state.page = 0; renderRows(); }
  });
  $('#techAll').addEventListener('click', () => { state.techs.clear(); renderTechChips(); renderResults(); if (state.tab === 'rows') renderRows(); });
  $('#dagScope').addEventListener('change', (e) => {
    state.dagScope = e.target.value; state.page = 0;
    renderResults();
    if (state.dagScope && !(state.model.nodes.get(state.focus)?.dags.has(state.dagScope))) focus('D|' + state.dagScope);
    else renderAll(true);
  });

  $('#depthSeg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    state.depth = Number(b.dataset.d);
    document.querySelectorAll('#depthSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderGraph(true);
  });
  $('#backBtn').addEventListener('click', () => {
    const prev = state.history.pop();
    if (prev) focus(prev, false);
    $('#backBtn').disabled = !state.history.length;
  });
  $('#zoomIn').addEventListener('click', () => zoomBy(1.2));
  $('#zoomOut').addEventListener('click', () => zoomBy(1 / 1.2));
  $('#zoomFit').addEventListener('click', () => { state.zoom = Math.max(0.2, Math.min(1.2, fitZoom())); applyZoom(); $('#canvas').scrollTo(0, 0); });
  $('#canvas').addEventListener('wheel', (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1); } }, { passive: false });

  // Drag-to-pan on the canvas background (mouse only; touch uses native scroll)
  (() => {
    const c = $('#canvas');
    let drag = null;
    c.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.node')) return;
      drag = { x: e.clientX, y: e.clientY, l: c.scrollLeft, t: c.scrollTop };
      c.classList.add('dragging'); c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', (e) => { if (!drag) return; c.scrollLeft = drag.l - (e.clientX - drag.x); c.scrollTop = drag.t - (e.clientY - drag.y); });
    const end = () => { drag = null; c.classList.remove('dragging'); };
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  })();
  $('#stage').addEventListener('mouseover', (e) => { const n = e.target.closest('.node[data-id]'); setHover(n ? n.dataset.id : null); });
  $('#stage').addEventListener('mouseleave', () => setHover(null));
  $('#stage').addEventListener('focusin', (e) => { const n = e.target.closest('.node[data-id]'); if (n) setHover(n.dataset.id); });
  $('#stage').addEventListener('focusout', () => setHover(null));

  // Detail actions
  $('#detail').addEventListener('click', async (e) => {
    if (e.target.closest('#viewRowsBtn')) { state.rowsFocus = state.focus; state.page = 0; setTab('rows'); return; }
    if (e.target.closest('#copyName')) {
      const name = state.model.nodes.get(state.focus)?.name || '';
      try { await navigator.clipboard.writeText(name); toast('Copied to clipboard'); }
      catch {
        const h = $('.d-name'); const r = document.createRange(); r.selectNodeContents(h);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        toast('Name selected — press Ctrl+C to copy');
      }
    }
  });

  // Tabs
  $('#tabGraph').addEventListener('click', () => setTab('graph'));
  $('#tabRows').addEventListener('click', () => setTab('rows'));
  let rqTimer;
  $('#rq').addEventListener('input', (e) => { clearTimeout(rqTimer); rqTimer = setTimeout(() => { state.rowsQuery = e.target.value; state.page = 0; renderRows(); }, 120); });
  $('#onlyBlank').addEventListener('change', (e) => { state.onlyBlank = e.target.checked; state.page = 0; renderRows(); });
  $('#viewRows').addEventListener('click', (e) => {
    if (e.target.closest('#clearRowsFocus')) { state.rowsFocus = null; state.page = 0; renderRows(); }
    if (e.target.closest('#prevPage')) { state.page--; renderRows(); $('#tableWrap').scrollTop = 0; }
    if (e.target.closest('#nextPage')) { state.page++; renderRows(); $('#tableWrap').scrollTop = 0; }
  });

  // Upload: button, file picker, drag & drop anywhere
  $('#uploadBtn').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', (e) => { const f = e.target.files?.[0]; if (f) loadFile(f); e.target.value = ''; });
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('#drop').hidden = false; } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').hidden = true; });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
    const f = e.dataTransfer?.files?.[0]; if (f) loadFile(f);
  });
  $('#resetData').addEventListener('click', () => {
    store.del(STORE_KEY);
    setDataset(rowsFromEmbedded(), EMBEDDED_NAME, 'built-in');
    toast('Switched back to the built-in dataset');
  });

  // Theme toggle (overrides the system setting for this page)
  $('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  });

  window.addEventListener('resize', () => { if (state.tab === 'graph') applyZoom(); });

  /* ================= Boot ================= */
  const saved = store.get(STORE_KEY);
  try {
    if (saved && Array.isArray(saved.rows) && saved.rows.length) {
      const header = FIELDS.map(([k]) => ({ dag: 'DAG Name', task: 'DAG Task Id', bash: 'Bash File Name', script: 'Python Script File Name', target: 'Target Table Path', tType: 'Target Table Type', source: 'Source', sType: 'Source Type' }[k]));
      setDataset(rowsFromAoa([header, ...saved.rows]), saved.name || 'Uploaded file', 'upload');
    } else if (EMBEDDED) {
      setDataset(rowsFromEmbedded(), EMBEDDED_NAME, 'built-in');
    } else throw new Error('no data');
  } catch {
    $('#datasetName').textContent = 'No dataset';
    $('#results').innerHTML = `<li class="empty"><h3>Load a lineage file</h3><p>Use “Load CSV / Excel” or drop a file with the Master Data DAG columns.</p></li>`;
  }
})();
</script>

</body>
</html>
